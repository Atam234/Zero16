name: Android APK

on:
  pull_request:
    paths:
      - packages/mobile/**
      - .github/workflows/build-android.yml
  push:
    paths:
      - packages/mobile/**
      - .github/workflows/build-android.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build web bundle and sync Android project
        working-directory: packages/mobile
        run: bun run sync

      - name: Build APK
        working-directory: packages/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-android-debug
          path: packages/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # A fixed tag gives the latest APK a stable download link that works on a phone without signing in.
      - name: Publish APK release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp packages/mobile/android/app/build/outputs/apk/debug/app-debug.apk opencode.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest opencode.apk --target "$GITHUB_SHA" --prerelease \
            --title "OpenCode Android (latest)" \
            --notes "Debug APK built from ${GITHUB_REF_NAME} at ${GITHUB_SHA}."
